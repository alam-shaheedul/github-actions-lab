name: Basic Checkout Lab

on:
  push:
    branches:
      - main

jobs:
  basic-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: List files
        run: ls -la
      - name: Show system info
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Operating System: Linux 88825eca8bdf4c5b 5.10.51 #1 SMP Mon Jul 19 19:08:01 UTC 2021 x86_64 x86_64 x86_64 GNU/Linux"
          echo "Current Directory: /home/poridhian/github-actions-lab"
      - name: Check versions
        run: |
          echo "Node version: v22.16.0"
          echo "Python version: Python 3.12.3"
          echo "Git version: git version 2.43.0"
